<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Scraper</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            width: 100%;
            max-width: 900px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #333;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }
        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #586bd6; }
        .message {
            display: none;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 500;
        }
        .error { background: #ffe4e4; color: #c62828; }
        .success { background: #e8f5e9; color: #2e7d32; }
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #555;
        }
        .spinner {
            width: 32px;
            height: 32px;
            border: 4px solid #ddd;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            margin: 0 auto 10px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .results {
            display: none;
            margin-top: 20px;
        }
        .result-block {
            margin-bottom: 25px;
        }
        .result-block h3 {
            margin-bottom: 10px;
            color: #4a4a4a;
        }
        .result-box {
            background: #f9f9f9;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 6px;
        }
        .result-item {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            word-break: break-word;
        }
        .result-item:last-child { border-bottom: none; }
        .empty { color: #777; font-style: italic; }
        a { color: #3b5bdb; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
        }
        .image-card {
            text-align: center;
        }
        .image-card img {
            width: 100%;
            max-height: 150px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #ddd;
        }
        .image-alt { font-size: 12px; color: #666; margin-top: 5px; }
        @media (max-width: 600px) {
            .input-row { flex-direction: column; }
            .container { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🕷️ Web Scraper</h1>
        <p class="subtitle">Enter a website URL to extract text, links, headings, and images.</p>

        <div class="input-row">
            <input id="urlInput" type="text" placeholder="https://example.com" />
            <button onclick="scrapeWebsite()">Scrape</button>
        </div>

        <div id="errorMessage" class="message error"></div>
        <div id="successMessage" class="message success"></div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <div>Scraping website...</div>
        </div>

        <div id="results" class="results">
            <div class="result-block">
                <h3>Page Title</h3>
                <div class="result-box" id="titleResult"></div>
            </div>

            <div class="result-block">
                <h3>Headings</h3>
                <div class="result-box" id="headingsResult"></div>
            </div>

            <div class="result-block">
                <h3>Links</h3>
                <div class="result-box" id="linksResult"></div>
            </div>

            <div class="result-block">
                <h3>Paragraphs</h3>
                <div class="result-box" id="paragraphsResult"></div>
            </div>

            <div class="result-block">
                <h3>Images</h3>
                <div class="result-box" id="imagesResult"></div>
            </div>
        </div>
    </div>

    <script>
        const urlInput = document.getElementById('urlInput');
        const results = document.getElementById('results');
        const loading = document.getElementById('loading');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');

        urlInput.addEventListener('keydown', function (event) {
            if (event.key === 'Enter') {
                scrapeWebsite();
            }
        });

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            successMessage.style.display = 'none';
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.style.display = 'block';
            errorMessage.style.display = 'none';
        }

        function escapeHtml(value) {
            return value
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        async function scrapeWebsite() {
            const url = urlInput.value.trim();
            if (!url) {
                showError('Please enter a URL.');
                return;
            }

            loading.style.display = 'block';
            results.style.display = 'none';
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';

            try {
                const response = await fetch('/api/scrape', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });

                const data = await response.json();

                if (!data.success) {
                    showError(data.message || 'An error occurred while scraping.');
                    loading.style.display = 'none';
                    return;
                }

                const pageData = data.data;
                document.getElementById('titleResult').innerHTML = `<div class="result-item">${escapeHtml(pageData.title)}</div>`;

                const headings = pageData.headings.length ?
                    pageData.headings.map(item => `<div class="result-item">${escapeHtml(item)}</div>`).join('') :
                    '<div class="result-item empty">No headings found</div>';
                document.getElementById('headingsResult').innerHTML = headings;

                const links = pageData.links.length ?
                    pageData.links.map(item => `
                        <div class="result-item">
                            <a href="${item.href}" target="_blank">${escapeHtml(item.text || item.href)}</a><br>
                            <small>${escapeHtml(item.href)}</small>
                        </div>
                    `).join('') :
                    '<div class="result-item empty">No links found</div>';
                document.getElementById('linksResult').innerHTML = links;

                const paragraphs = pageData.paragraphs.length ?
                    pageData.paragraphs.slice(0, 10).map(item => `<div class="result-item">${escapeHtml(item)}</div>`).join('') :
                    '<div class="result-item empty">No paragraphs found</div>';
                document.getElementById('paragraphsResult').innerHTML = paragraphs;

                const images = pageData.images.length ?
                    `<div class="image-grid">${pageData.images.map(img => `
                        <div class="image-card">
                            <img src="${img.src}" alt="${escapeHtml(img.alt)}" onerror="this.style.display='none'" />
                            <div class="image-alt">${escapeHtml(img.alt)}</div>
                        </div>
                    `).join('')}</div>` :
                    '<div class="result-item empty">No images found</div>';
                document.getElementById('imagesResult').innerHTML = images;

                results.style.display = 'block';
                showSuccess('Scraping completed successfully.');
            } catch (error) {
                showError('Request failed: ' + error.message);
            } finally {
                loading.style.display = 'none';
            }
        }
    </script>
</body>
</html>
